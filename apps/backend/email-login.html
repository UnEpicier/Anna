<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Votre code de connexion</title>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#fafafa;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <span style="font-size:20px;font-weight:700;color:#7f5539;letter-spacing:-0.5px;">Anna</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#ffffff;border-radius:16px;padding:36px 32px 28px;border:1px solid #ede8e4;">

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">

                <!-- Title -->
                <tr>
                  <td style="padding-bottom:8px;">
                    <h1 style="margin:0;font-size:18px;font-weight:600;color:#1a1a1a;line-height:1.4;">
                      Votre code de connexion
                    </h1>
                  </td>
                </tr>

                <!-- Description -->
                <tr>
                  <td style="padding-bottom:28px;">
                    <p style="margin:0;font-size:14px;color:#717182;line-height:1.6;">
                      Utilisez le code ci-dessous pour vous connecter à votre compte.
                      Il est valable pendant <strong style="color:#7f5539;">10 minutes</strong>.
                    </p>
                  </td>
                </tr>

                <!-- Code -->
                <tr>
                  <td align="center" style="padding-bottom:28px;">
                    <table role="presentation" cellspacing="0" cellpadding="0">
                      <tr>
                        <td style="background-color:#f5f1ed;border-radius:12px;padding:16px 28px;text-align:center;">
                          <span style="font-size:28px;font-weight:700;color:#7f5539;letter-spacing:8px;">
                            {{ code }}
                          </span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Divider -->
                <tr>
                  <td style="padding-bottom:20px;">
                    <hr style="border:none;border-top:1px solid #ede8e4;margin:0;" />
                  </td>
                </tr>

                <!-- Warning -->
                <tr>
                  <td>
                    <p style="margin:0;font-size:12px;color:#717182;line-height:1.6;">
                      Si vous n'avez pas demandé ce code, ignorez cet email. Votre compte reste sécurisé.
                    </p>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:20px;">
              <p style="margin:0;font-size:11px;color:#717182;">
                &copy; 2026 Anna. Tous droits réservés.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
