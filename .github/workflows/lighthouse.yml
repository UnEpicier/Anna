name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time to avoid Pages conflicts
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Lighthouse Report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NODE_ENV: production
      PORT: "8080"
      CORS_ORIGIN: http://localhost:3000
      COMMON_RATE_LIMIT_WINDOW_MS: "900000"
      COMMON_RATE_LIMIT_MAX_REQUESTS: "10000"
      API_URL: http://localhost:8080
      MAILJET_PUBLIC_KEY: ${{ secrets.MAILJET_PUBLIC_KEY }}
      MAILJET_PRIVATE_KEY: ${{ secrets.MAILJET_PRIVATE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm turbo run build --filter=@repo/app-types --filter=@repo/utils

      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm exec prisma generate

      - name: Build backend
        working-directory: apps/backend
        run: pnpm run build

      - name: Apply migrations
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        working-directory: apps/backend
        run: pnpm exec prisma db seed

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_API_KEY }}

      - name: Build backoffice
        working-directory: apps/backoffice
        run: pnpm build
        env:
          NEXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_API_KEY }}

      - name: Start backend
        working-directory: apps/backend
        run: node dist/index.js &

      - name: Start frontend server
        working-directory: apps/frontend
        run: pnpm exec next start -p 3000 &

      - name: Start backoffice server
        working-directory: apps/backoffice
        run: pnpm exec next start -p 3001 &

      - name: Wait for servers to be ready
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8080/health-check > /dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:3001 > /dev/null; do sleep 2; done'

      - name: Create reports directory
        run: mkdir -p lighthouse-reports

      - name: Run Lighthouse on frontend
        run: |
          npx --yes lighthouse http://localhost:3000 \
            --output html \
            --output-path lighthouse-reports/frontend.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu" \
            --quiet

      - name: Run Lighthouse on backoffice
        run: |
          npx --yes lighthouse http://localhost:3001 \
            --output html \
            --output-path lighthouse-reports/backoffice.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu" \
            --quiet

      - name: Generate index page
        run: |
          cat > lighthouse-reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Lighthouse Reports</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
              .card { background: #fff; border-radius: 12px; padding: 2.5rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); max-width: 480px; width: 100%; }
              h1 { font-size: 1.5rem; color: #111; margin-bottom: 0.5rem; }
              .subtitle { color: #6b7280; font-size: 0.875rem; margin-bottom: 2rem; }
              a { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; margin: 0.5rem 0; background: #f3f4f6; border-radius: 8px; text-decoration: none; color: #111; font-weight: 500; transition: background 0.15s; }
              a:hover { background: #e5e7eb; }
              a .arrow { color: #6b7280; }
              .meta { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb; color: #9ca3af; font-size: 0.75rem; }
              .meta code { font-family: monospace; background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 4px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Lighthouse Reports</h1>
              <p class="subtitle">Performance, accessibility &amp; best practices</p>
              <a href="frontend.html">Frontend <span class="arrow">→</span></a>
              <a href="backoffice.html">Backoffice <span class="arrow">→</span></a>
              <div class="meta">
                <p>Run #${{ github.run_number }} &mdash; Commit <code>${{ github.sha }}</code></p>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lighthouse-reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
