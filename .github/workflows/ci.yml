name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  check-types:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types

  knip:
    name: Dead Code (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Check dead code
        run: pnpm knip
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: password123
      NODE_ENV: test
      PORT: "8080"
      CORS_ORIGIN: http://localhost:3000
      COMMON_RATE_LIMIT_WINDOW_MS: "900000"
      COMMON_RATE_LIMIT_MAX_REQUESTS: "10000"
      MAILJET_PUBLIC_KEY: ${{ secrets.MAILJET_PUBLIC_KEY }}
      MAILJET_PRIVATE_KEY: ${{ secrets.MAILJET_PRIVATE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:8-alpine redis-server --requirepass password123
          until docker exec redis redis-cli -a password123 ping; do sleep 1; done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm turbo run build --filter=@repo/app-types

      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm exec prisma generate

      - name: Apply migrations
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        working-directory: apps/backend
        run: pnpm exec prisma db seed

      - name: Run tests with coverage
        working-directory: apps/backend
        run: pnpm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/backend/coverage/
          retention-days: 7

  size-limit:
    name: Bundle Size
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: password123
      NODE_ENV: production
      PORT: "8080"
      CORS_ORIGIN: http://localhost:3000
      COMMON_RATE_LIMIT_WINDOW_MS: "900000"
      COMMON_RATE_LIMIT_MAX_REQUESTS: "10000"
      API_URL: http://localhost:8080
      MAILJET_PUBLIC_KEY: ${{ secrets.MAILJET_PUBLIC_KEY }}
      MAILJET_PRIVATE_KEY: ${{ secrets.MAILJET_PRIVATE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:8-alpine redis-server --requirepass password123
          until docker exec redis redis-cli -a password123 ping; do sleep 1; done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm turbo run build --filter=@repo/app-types --filter=@repo/utils

      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm exec prisma generate

      - name: Build backend
        working-directory: apps/backend
        run: pnpm run build

      - name: Apply migrations
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        working-directory: apps/backend
        run: pnpm exec prisma db seed

      - name: Start backend
        working-directory: apps/backend
        run: node dist/index.js &

      - name: Wait for backend
        run: timeout 60 bash -c 'until curl -s http://localhost:8080/health-check > /dev/null; do sleep 2; done'

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build
        env:
          NEXT_PUBLIC_MAPTILER_API_KEY: placeholder

      - name: Check bundle size
        working-directory: apps/frontend
        run: pnpm size

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, check-types, test-backend, knip, size-limit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: password123
      NODE_ENV: production
      PORT: "8080"
      CORS_ORIGIN: http://localhost:3000
      COMMON_RATE_LIMIT_WINDOW_MS: "900000"
      COMMON_RATE_LIMIT_MAX_REQUESTS: "10000"
      API_URL: http://localhost:8080
      MAILJET_PUBLIC_KEY: ${{ secrets.MAILJET_PUBLIC_KEY }}
      MAILJET_PRIVATE_KEY: ${{ secrets.MAILJET_PRIVATE_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:8-alpine redis-server --requirepass password123
          until docker exec redis redis-cli -a password123 ping; do sleep 1; done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm turbo run build --filter=@repo/app-types --filter=@repo/utils

      - name: Generate Prisma client
        working-directory: apps/backend
        run: pnpm exec prisma generate

      - name: Build backend
        working-directory: apps/backend
        run: pnpm run build

      - name: Apply migrations
        working-directory: apps/backend
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        working-directory: apps/backend
        run: pnpm exec prisma db seed

      - name: Start backend
        working-directory: apps/backend
        run: node dist/index.js &

      - name: Wait for backend
        run: timeout 60 bash -c 'until curl -s http://localhost:8080/health-check > /dev/null; do sleep 2; done'

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build
        env:
          NEXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_API_KEY }}

      - name: Build backoffice
        working-directory: apps/backoffice
        run: pnpm run build
        env:
          NEXT_PUBLIC_MAPTILER_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_API_KEY }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    # Only runs on push to main, never on PRs or release commits themselves
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # If main is branch-protected (requires PR reviews), use a PAT instead:
          # token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Each step runs semantic-release scoped to its directory via
      # semantic-release-monorepo, which filters commits by the files
      # changed in that path. A successful release creates and pushes a
      # chore(release): name@x.y.z [skip ci] commit + tag.
      # Packages are released in dependency order.

      - name: Release app-types
        working-directory: packages/app-types
        run: npx semantic-release -e semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release backend
        working-directory: apps/backend
        run: npx semantic-release -e semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release frontend
        working-directory: apps/frontend
        run: npx semantic-release -e semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release backoffice
        working-directory: apps/backoffice
        run: npx semantic-release -e semantic-release-monorepo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
